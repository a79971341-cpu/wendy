  /* Layout: full-bleed pixel street drawn at 16px per tile and scaled by whole numbers;
     square ink-bordered panels float above it (logo top, cat picker bottom, HUD corners, d-pad on touch screens).
     One deliberate light look. */
  :root {
    --ink: #2D2235;
    --paper: #FFFDF6;
    --cheese: #FFA94D;
    --cheese-deep: #E9801C;
    --grass: #98CF63;
    --muted: #6D6178;
    --dim: rgba(45, 34, 53, 0.42);
    --font: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", monospace;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--grass); color: var(--ink);
    font-family: var(--font); font-size: 12px; line-height: 1.5;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    -webkit-font-smoothing: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; }

  .outline { color: #fff; text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 6px 0 var(--ink), 3px 6px 0 var(--ink), -3px 6px 0 var(--ink); }
  .outline-sm { color: #fff; text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink); }

  /* HUD */
  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .score { font-weight: 700; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
  .best-mini { display: inline-block; font-size: 12px; margin-top: 12px; padding: 2px 6px; background: var(--paper); border: 3px solid var(--ink); }
  .hud-right { display: flex; gap: 10px; align-items: center; }
  .pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
    padding: 4px 10px 4px 6px; font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums;
  }

    for (const it of L.items) if (it.x + it.len > -hw && it.x < hw) drawVehicle(it, L, y);
  } else if (L.type === 'river') {
    for (const it of L.items) if (it.x + it.len > -hw && it.x < hw) { if (it.kind === 'lily') drawLily(it, y); else drawLog(it, y); }
  } else if (L.type === 'rail') {
    drawSignals(L, y);
    if (L.state === 'pass') drawTrain(L, y);
  }
}

/* ---------- drawing: cat & dog ---------- */
function catView(f) { return f === 'up' ? 'back' : f === 'down' ? 'front' : f === 'left' ? 'sideL' : 'side'; }
const ANCHOR = { front: 6.5, back: 6.5, side: 8, sideL: 8, flat: 7.5 };
function drawCatInWorld() {
  if ((state === 'dying' || state === 'over') && deathReason === 'dog' && deathT > 0.32) return;
  const coat = state === 'title' ? CATS[viewIdx] : playCoat;
  const view = cat.flat ? 'flat' : (state === 'title' ? 'front' : catView(cat.facing));
  const spr = catSprite(coat, view, Math.floor(time * 2.5) % 2, view !== 'flat' && (time % 3.3) < 0.15);
  let cx = fx(cat.x + cat.snap);
  if (cat.bump > 0) cx += Math.floor(cat.bump * 40) % 2 ? 1 : -1;
  const gy = Y(cat.vr), zp = Math.round(cat.z * 5);
  const x = Math.round(cx - ANCHOR[view]);
  pell(Math.round(cx), gy + 5, zp > 2 ? 3 : 4, 1, SHADOW);
  if (view === 'flat') { v.drawImage(spr, x, gy + 1); return; }
  const top = gy + 6 - spr.height - zp;
  if ((state === 'dying' || state === 'over') && (deathReason === 'water' || deathReason === 'swept')) {
    const sink = Math.min(16, Math.floor(deathT / 0.04));
    if (sink >= 16) return;
    v.drawImage(spr, 0, 0, 16, 16 - sink, x, top + sink, 16, 16 - sink);
    return;
  }
  v.drawImage(spr, x, top);
}
function drawDog(cx, cy, open) {
  oell(cx - 13, cy + 2, 4, 9, '#7A4B2E'); oell(cx + 13, cy + 2, 4, 9, '#7A4B2E');
  oell(cx, cy, 13, 11, '#D69A5C');
  pell(cx + 5, cy - 4, 4, 3, '#B97A42');
  oell(cx, cy + 6, 7, 4, '#F6DDB7');
  R(cx - 2, cy + 2, 5, 3, INK); R(cx - 1, cy + 2, 1, 1, '#6B5B70');
  R(cx - 7, cy - 5, 2, 3, INK); R(cx + 5, cy - 5, 2, 3, INK);
  R(cx - 7, cy - 5, 1, 1, '#FFFFFF'); R(cx + 5, cy - 5, 1, 1, '#FFFFFF');
  R(cx - 9, cy - 8, 4, 1, INK); R(cx + 5, cy - 8, 4, 1, INK);
  if (open) { R(cx - 3, cy + 7, 7, 3, '#7B2D3B'); R(cx - 1, cy + 8, 3, 2, '#F2789A'); }
  else { R(cx, cy + 5, 1, 3, INK); R(cx - 3, cy + 8, 7, 1, INK); }
}
function speech(x, y, text) {
  v.font = '700 12px Galmuri11, monospace';
  const w = Math.ceil(v.measureText(text).width) + 8;
  obox(x - Math.round(w / 2), y - 9, w, 14, '#FFFFFF');
  v.fillStyle = INK; v.textAlign = 'center'; v.textBaseline = 'alphabetic'; v.fillText(text, x, y + 2);
}
function drawDogLayer() {
  if (state === 'play' && !cat.dead) {
    const by = fy(cat.vr), p = (by - (VB - 30)) / 28;
    if (p > 0) {
      const q = Math.min(1, p), x = clamp(X(cat.x) + (X(cat.x) > VW / 2 ? -26 : 26), 16, VW - 16), y = Math.round(VB + 12 - q * 10);
      drawDog(x, y, false);
      if (q > 0.3) speech(clamp(x + (x > VW / 2 ? -24 : 24), 14, VW - 14), y - 14, '멍!');
    }
  } else if ((state === 'dying' || state === 'over') && deathReason === 'dog') {
    const target = Y(cat.vr) - 2, start = VB + 14, T = deathT;
    let y;
    if (T < 0.3) { const e = T / 0.3; y = start + (target - start) * (1 - (1 - e) * (1 - e)); }
    else if (T < 0.8) y = target + (Math.floor(T * 20) % 2);
    else { const e = Math.min(1, (T - 0.8) / 0.5); y = target + (start - target) * e * e; }
    drawDog(dogX, Math.round(y), T < 0.34);
  }
}

/* ---------- render ---------- */
function render() {
  v.fillStyle = '#98CF63'; v.fillRect(0, 0, VW, VH);
  const topRow = Math.ceil(cam + VY0 / TS + 1.5), botRow = Math.floor(cam - (VH - VY0) / TS - 1);
  for (let r = topRow; r >= botRow; r--) drawGround(r);
  v.globalAlpha = 0.28;
  const lx = X(-HALF - 0.5), rx = X(HALF + 0.5);
  R(0, 0, lx, VH, '#28183C'); R(rx, 0, VW - rx, VH, '#28183C');
  v.globalAlpha = 1;
  const catRow = Math.ceil(cat.vr - 1e-4);
  if (cat.flat) drawCatInWorld();
  for (let r = topRow; r >= botRow; r--) {
    drawObjects(r);
    if (!cat.flat && r === catRow) drawCatInWorld();
  }
  drawParticles();
  drawDogLayer();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(vc, 0, 0, VW * S, VH * S);
}
function renderPreview() {
  const s = pv.width, k = Math.max(1, Math.floor(s / 20));
  pg.setTransform(1, 0, 0, 1, 0, 0);
  pg.clearRect(0, 0, s, s);
  pg.imageSmoothingEnabled = false;
  const spr = catSprite(CATS[viewIdx], 'front', Math.floor(time * 2.5) % 2, (time % 3.1) < 0.15);
  const ox = Math.round(s / 2 - 6.5 * k), oy = Math.round(s / 2 - 8 * k);
  pg.fillStyle = 'rgba(35,25,45,0.18)';
  pg.fillRect(ox + 2 * k, oy + 15 * k, 9 * k, k);
  pg.drawImage(spr, ox, oy, 16 * k, 16 * k);
}

/* ---------- loop ---------- */
function update(dt) {
  time += dt;
  updateLanes(dt);
  if (state === 'play') {
    updateCat(dt);
    if (!cat.dead) checkHits();
    if (!cat.dead) {
      if (cat.vr > cam) cam += (cat.vr - cam) * Math.min(1, dt * 6);
      if (started) cam += (0.28 + Math.min(0.5, score * 0.0032)) * dt;
      if (fy(cat.vr) > VB - 2) die('dog');
    }
  } else if (state === 'dying' || state === 'over') {
    deathT += dt;
    if (!meowed && deathT > 0.22) { meowed = true; sfx('meow'); }
    if (state === 'dying' && deathT > 1.25) showOver();
  } else if (state === 'title') {
    cam = titleCam();
  }
  if (cat.bump > 0) cat.bump -= dt;
  if (cat.snap) { cat.snap *= Math.pow(0.0004, dt); if (Math.abs(cat.snap) < 0.02) cat.snap = 0; }
  updateParticles(dt);
  ensureLanes(Math.ceil(cam + VY0 / TS) + 8);
  const minRow = Math.floor(cam - (VH - VY0) / TS) - 6;
  for (const r of lanes.keys()) if (r < minRow) lanes.delete(r);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  if (state === 'title') renderPreview();
  requestAnimationFrame(frame);
}

/* ---------- screens ---------- */
const owned = c => c.cost === 0 || save.unlocked.includes(c.id);
function selectedCat() { return CATS.find(c => c.id === save.selected) || CATS[0]; }
function refreshHud() {
  scoreEl.textContent = score;
  bestMini.textContent = '최고 ' + save.best;
  fishCount.textContent = save.fish;
}
function updatePicker() {
  const c = CATS[viewIdx], has = owned(c);
  $('catName').textContent = c.name;
  $('catTag').textContent = c.tag;
  $('lockBadge').hidden = has;
  $('lockBadge').textContent = `생선 ${c.cost}마리`;
  if (has) {
    save.selected = c.id;
    startBtn.disabled = false; startBtn.textContent = '시작하기';
    altBtn.hidden = true;
  } else {
    if (save.fish >= c.cost) { startBtn.disabled = false; startBtn.textContent = `생선 ${c.cost}마리로 입양하기`; }
    else { startBtn.disabled = true; startBtn.textContent = `생선이 ${c.cost - save.fish}마리 더 필요해요`; }
    altBtn.hidden = false; altBtn.textContent = ro(selectedCat().name) + ' 시작';
  }
  $('dots').innerHTML = CATS.map((k, i) => `<i class="${i === viewIdx ? 'on' : owned(k) ? 'owned' : 'locked'}"></i>`).join('');
  $('bestTitle').textContent = save.best;
  $('fishTitle').textContent = save.fish;
  writeSave();
}
function stepCat(d) { viewIdx = (viewIdx + d + CATS.length) % CATS.length; updatePicker(); sfx('tick'); }
function beginPlay(coat) {
  playCoat = coat;
  state = 'play'; started = false; score = 0; runFish = 0;
  cat.facing = 'up';
  titleScreen.hidden = true; overScreen.hidden = true;
  hud.hidden = false; hint.hidden = false;
  const touch = isTouch();
  pad.hidden = !touch;
  hint.textContent = touch ? '버튼이나 화면을 탭하면 앞으로!' : '↑ 키를 눌러 출발!';
  hint.classList.toggle('above-pad', touch);
  layout();
  refreshHud();
}
function startFromTitle(coat) {
  ensureAudio();
  viewIdx = CATS.indexOf(coat);
  beginPlay(coat);
}
function titleStart() {
  const c = CATS[viewIdx];
  startFromTitle(owned(c) ? c : selectedCat());
}
function restart() {
  ensureAudio();
  resetWorld(); resetCat(); particles.length = 0; cam = 0;
  beginPlay(playCoat);
}
function goTitle() {
  resetWorld(); resetCat(); particles.length = 0;
  cat.facing = 'down';
  state = 'title';
  layout();
  viewIdx = Math.max(0, CATS.indexOf(selectedCat()));
  overScreen.hidden = true; hud.hidden = true; hint.hidden = true; pad.hidden = true; titleScreen.hidden = false;
  updatePicker();
}
function showOver() {
  state = 'over'; overAt = time;
  const isBest = score > save.best;
  if (isBest) save.best = score;
  writeSave();
  const m = MSG[deathReason === 'car' ? 'car_' + deathKind : deathReason] || MSG.car_car;
  $('overReason').textContent = m[0];
  $('overTip').textContent = m[1];
  $('finalScore').textContent = score;
  $('overBest').textContent = save.best;
  $('overFish').textContent = '+' + runFish;
  $('newBest').hidden = !(isBest && score > 0);
  refreshHud();
  overScreen.hidden = false;
  if (!isTouch()) { try { $('retryBtn').focus({ preventScroll: true }); } catch (e) {} }
  if (isBest && score > 0) setTimeout(() => sfx('fanfare'), 250);
}
function setMuted(m) {
  save.muted = m; writeSave();
  $('icoOn').hidden = m; $('icoOff').hidden = !m;
  $('muteBtn').setAttribute('aria-label', m ? '소리 켜기' : '소리 끄기');
}

/* ---------- input ---------- */
const KEYS = { ArrowUp: [0, 1], KeyW: [0, 1], ArrowDown: [0, -1], KeyS: [0, -1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
window.addEventListener('keydown', e => {
  const mv = KEYS[e.code], act = e.code === 'Space' || e.code === 'Enter';
  if (!mv && !act) { if (e.code === 'KeyM' && !e.repeat) setMuted(!save.muted); return; }
  if (act && e.target && e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  ensureAudio();
  if (e.repeat) return;
  if (state === 'play') { if (mv) tryMove(mv[0], mv[1]); }
  else if (state === 'title') {
    if (mv && mv[0]) stepCat(mv[0]);
    else if ((mv && mv[1] > 0) || act) titleStart();
  } else if (state === 'over') {
    if (act && time - overAt > 0.35) restart();
  }
});
// canvas: tap = forward, swipe = direction (fires as soon as the finger has moved far enough)
let pdown = null;
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  pdown = { x: e.clientX, y: e.clientY, t: performance.now(), used: false };
});
cv.addEventListener('pointermove', e => {
  if (!pdown || pdown.used || state !== 'play') return;
  const dx = e.clientX - pdown.x, dy = e.clientY - pdown.y;
  if (Math.hypot(dx, dy) > 18) {
    pdown.used = true;
    if (Math.abs(dx) > Math.abs(dy)) tryMove(dx > 0 ? 1 : -1, 0); else tryMove(0, dy < 0 ? 1 : -1);
  }
});
cv.addEventListener('pointerup', () => {
  if (pdown && !pdown.used && state === 'play') tryMove(0, 1);
  pdown = null;
});
cv.addEventListener('pointercancel', () => { pdown = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
// d-pad: reacts on press, not release
for (const b of pad.querySelectorAll('.pk')) {
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); ensureAudio();
    b.classList.add('on');
    tryMove(+b.dataset.dx, +b.dataset.dr);
  });
  const off = () => b.classList.remove('on');
  b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

$('prevCat').addEventListener('click', () => { ensureAudio(); stepCat(-1); });
$('nextCat').addEventListener('click', () => { ensureAudio(); stepCat(1); });
startBtn.addEventListener('click', () => {
  ensureAudio();
  const c = CATS[viewIdx];
  if (owned(c)) { startFromTitle(c); return; }
  if (save.fish >= c.cost) {
    save.fish -= c.cost; save.unlocked.push(c.id); save.selected = c.id;
    sfx('buy'); updatePicker();
  }
});
altBtn.addEventListener('click', () => startFromTitle(selectedCat()));
$('retryBtn').addEventListener('click', restart);
$('menuBtn').addEventListener('click', goTitle);
$('muteBtn').addEventListener('click', () => { ensureAudio(); setMuted(!save.muted); });
window.addEventListener('resize', resize);
if (coarseQuery && coarseQuery.addEventListener) coarseQuery.addEventListener('change', () => { if (state !== 'title') pad.hidden = !isTouch(); layout(); });
document.addEventListener('visibilitychange', () => { last = performance.now(); });

/* ---------- boot ---------- */
function boot(data) {
  loadSave(data && data.save);
  setMuted(save.muted);
  resize();
  resetWorld(); resetCat();
  goTitle();
  resize();
  requestAnimationFrame(t => { last = t; frame(t); });
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ save: { ...save } })); } catch (e) {}
const go = () => { if (hot && hot.ready) hot.ready(d => boot(d || {})); else boot((hot && hot.data) || {}); };
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('12px Galmuri11'), document.fonts.load('700 12px Galmuri11')]).then(go, go);
else go();
})();
</script>
